<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Prop Rulebook — page not found</title>
  <script>
    (function () {
      var path = location.pathname.replace(/\/+$/, "");
      if (/^\/proprulebook$/i.test(path)) {
        location.replace("/PropRulebook/" + location.search + location.hash);
      }
    })();
  </script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #080c12;
      color: #e6edf7;
      font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: min(520px, 100%);
      padding: 28px;
      border: 1px solid #1e2a3a;
      border-radius: 14px;
      background: #0d141e;
    }
    .eyebrow {
      margin: 0 0 6px;
      color: #5eead4;
      font: 700 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 10px; font-size: 26px; letter-spacing: -0.5px; }
    p { margin: 0 0 14px; color: #94a3b8; }
    a { color: #5eead4; }
    .btn {
      display: inline-block;
      padding: 9px 14px;
      border: 1px solid rgba(94, 234, 212, 0.35);
      border-radius: 8px;
      background: rgba(94, 234, 212, 0.08);
      color: #5eead4;
      font-weight: 650;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Prop Rulebook</p>
    <h1>Page not found</h1>
    <p>The address may be misspelled. The rulebook lives at <strong>/PropRulebook/</strong> — the path is case-sensitive.</p>
    <a class="btn" href="/PropRulebook/">Open the rulebook →</a>
  </main>
</body>
</html>
